name: flutter_foreground_task
description: This plugin is used to implement a foreground service on the Android platform.
version: 11.0.3+2
homepage: https://github.com/Dev-hwang/flutter_foreground_task

# FORK DIVERGENCE (tadelv/flutter_foreground_task): upstream 11.0.3 declares
# `sdk: ^3.12.0` / `flutter: ">=3.44.0"`. The Dart sources here are byte-identical to 9.2.2,
# so that raised floor is declarative rather than earned; keeping 9.2.2's floor lets
# decentespresso/decaid stay on Flutter 3.44.2 instead of bumping its release pipeline.
# Verified on Flutter 3.44.2 (Decaid's pinned toolchain) via .github/workflows/fork_compat.yml.
# The declared minimums below are inherited from 9.2.2 and are NOT exercised at 3.22/3.10 here.
# Exit condition: take upstream's values back once Decaid moves past Flutter 3.46.
environment:
  sdk: ^3.10.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  shared_preferences: ^2.5.5
  platform: ^3.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.pravera.flutter_foreground_task
        pluginClass: FlutterForegroundTaskPlugin
      ios:
        pluginClass: FlutterForegroundTaskPlugin
